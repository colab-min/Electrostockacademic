# Demo Electrostock: docker compose up --build
name: electrostock-demo

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-demo-root-password}
      MYSQL_DATABASE: electrostock
      MYSQL_USER: electrostock
      MYSQL_PASSWORD: ${DB_PASSWORD:-demo-app-password}
    command: ["--skip-log-bin", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3326}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: electrostock
      DB_PASSWORD: ${DB_PASSWORD:-demo-app-password}
      DB_NAME: electrostock
      JWT_SECRET: ${JWT_SECRET:-demo-only-secret-change-me-0123456789abcdef}
      RESET_SEED: ${RESET_SEED:-false}
    ports:
      - "127.0.0.1:${API_PORT:-8020}:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-4220}:80"
    depends_on:
      - backend

  phpmyadmin:
    image: phpmyadmin:5.2
    profiles: ["tools"]
    environment:
      PMA_HOST: mysql
    ports:
      - "127.0.0.1:${PMA_PORT:-8030}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:

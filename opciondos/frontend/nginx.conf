server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  set $nonce $request_id;
  sub_filter_once off;
  sub_filter_types text/html;
  sub_filter '__CSP_NONCE__' $nonce;
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$nonce' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'";

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri $uri/ /index.html;
  }
}

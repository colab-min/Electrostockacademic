<section class="pagina" [attr.aria-busy]="procesando()">
  <app-cabecera-vista titulo="Indicadores y reportes" hu="HU-14" contexto="Resumen del taller en el rango elegido." />

  <form class="rango" (ngSubmit)="generar()">
    <app-campo etiqueta="Desde" para="desde">
      <input id="desde" name="desde" type="date" required [(ngModel)]="desde" />
    </app-campo>
    <app-campo etiqueta="Hasta" para="hasta">
      <input id="hasta" name="hasta" type="date" required [(ngModel)]="hasta" />
    </app-campo>
    <app-boton tipo="submit" [procesando]="procesando()">Generar</app-boton>
  </form>

  @if (error()) {
    <app-aviso tipo="error">
      {{ error() }} <button type="button" class="enlace" (click)="generar()">Reintentar</button>
    </app-aviso>
  }

  @if (resumen(); as r) {
    @if (totalOrdenes() === 0 && r.ingresos === 0) {
      <app-estado-vacio titulo="No hay órdenes ni pagos en este rango." mensaje="Elija un rango de fechas más amplio." />
    } @else {
      <div class="cifras">
        <app-indicador titulo="Ingresos cobrados" [valor]="pesos(r.ingresos)" detalle="Pagos registrados en caja" icono="grafico" />
        <app-indicador titulo="Órdenes" [valor]="totalOrdenes()" detalle="Creadas en el rango" icono="orden" />
        <app-indicador titulo="Ocupación de franjas" [valor]="r.ocupacion.porcentaje + ' %'"
          [detalle]="r.ocupacion.reservadas + ' de ' + r.ocupacion.capacidad + ' cupos'" icono="calendario" />
        <app-indicador titulo="Satisfacción promedio" [valor]="r.satisfaccion.promedio !== null ? r.satisfaccion.promedio + ' / 5' : 'Sin datos'"
          [detalle]="r.satisfaccion.respuestas + ' encuestas respondidas'" icono="check-circulo" />
      </div>

      <div class="graficos">
        <app-tarjeta>
          <app-grafico-barras titulo="Órdenes por estado" [datos]="barrasEstado($any(r.ordenes_por_estado))" leyenda="Número de órdenes" />
        </app-tarjeta>
        <app-tarjeta>
          @if (r.repuestos.length) {
            <app-grafico-barras titulo="Repuestos consumidos" [datos]="barrasRepuestos($any(r.repuestos))" unidad="u." leyenda="Unidades instaladas" />
          } @else {
            <app-estado-vacio titulo="No se instalaron repuestos en este rango." icono="paquete" />
          }
        </app-tarjeta>
      </div>

      <div class="tablas">
        <app-tarjeta titulo="Órdenes por estado">
          <app-tabla-datos titulo="Órdenes por estado" [columnas]="columnasEstado" [filas]="r.ordenes_por_estado" [celda]="celdaEstado" />
          <ng-template #celdaEstado let-fila let-columna="columna">
            @if (columna.clave === 'estado') { <app-insignia-estado [estado]="$any(fila).estado" /> } @else { {{ fila[columna.clave] }} }
          </ng-template>
        </app-tarjeta>
        <app-tarjeta titulo="Repuestos consumidos">
          @if (r.repuestos.length) {
            <app-tabla-datos titulo="Repuestos consumidos" [columnas]="columnasRepuestos" [filas]="r.repuestos" />
          } @else {
            <app-estado-vacio titulo="No se instalaron repuestos en este rango." />
          }
        </app-tarjeta>
      </div>
    }
  }
</section>

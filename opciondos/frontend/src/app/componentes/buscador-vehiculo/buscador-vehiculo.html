<form class="buscador" role="search" (submit)="$event.preventDefault(); enviar()">
  <label for="buscador-q" class="solo-lector">{{ etiqueta() }}</label>
  <div class="caja">
    <app-icono nombre="buscar" />
    <input id="buscador-q" type="search" [placeholder]="etiqueta()" [value]="valorInicial()"
      (input)="escribir($any($event.target).value)" autocomplete="off" />
  </div>
  <button type="submit" [disabled]="buscando()">{{ buscando() ? 'Procesando…' : 'Buscar' }}</button>
</form>

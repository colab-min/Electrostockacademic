<button [type]="tipo()" [class]="variante() + ' ' + tamano()" [disabled]="deshabilitado() || procesando()"
  [attr.aria-busy]="procesando()">
  @if (procesando()) {
    <span class="giro" aria-hidden="true"></span> Procesando…
  } @else {
    @if (icono(); as i) { <app-icono [nombre]="i" /> }
    <ng-content />
  }
</button>

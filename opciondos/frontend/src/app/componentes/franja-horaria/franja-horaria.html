<button type="button" [class]="estado()" [class.pocos]="pocos()" [class.seleccionada]="seleccionada()"
  [disabled]="estado() !== 'libre'" [attr.aria-pressed]="seleccionada()" (click)="elegir.emit()">
  <span class="hora tabular">{{ hora() }}</span>
  <span class="estado"><span class="punto" aria-hidden="true"></span>{{ etiqueta() }}</span>
  @if (detalle()) { <span class="detalle">{{ detalle() }}</span> }
</button>

<ol>
  @for (e of eventos(); track $index) {
    <li [class]="estado(e, $index)" [class.nuevo]="$index === nuevo()">
      <span class="titulo">{{ e.titulo }}@if (estado(e, $index) === 'actual') {<span class="solo-lector"> (estado actual)</span>}</span>
      @if (e.fecha) { <time [attr.datetime]="e.fecha" class="tabular">{{ formato(e.fecha) }}</time> }
      @if (e.detalle) { <span class="detalle">{{ e.detalle }}</span> }
    </li>
  }
</ol>

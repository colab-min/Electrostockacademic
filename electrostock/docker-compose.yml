services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: electrostock
      MYSQL_USER: ${DB_APP_USER:-electrostock_app}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:-local-app-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-local-root-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrations:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    command: alembic upgrade head
    environment:
      DATABASE_URL: mysql+pymysql://${DB_APP_USER:-electrostock_app}:${DB_APP_PASSWORD:-local-app-password}@mysql:3306/electrostock
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: local
      DATABASE_URL: mysql+pymysql://${DB_APP_USER:-electrostock_app}:${DB_APP_PASSWORD:-local-app-password}@mysql:3306/electrostock
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-before-deploying}
      CORS_ORIGINS: http://127.0.0.1:4200,http://127.0.0.1:8080
      COOKIE_SECURE: "false"
      CREATE_SCHEMA: "false"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend

  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["herramientas"]
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_APP_USER:-electrostock_app}
      PMA_PASSWORD: ${DB_APP_PASSWORD:-local-app-password}
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:

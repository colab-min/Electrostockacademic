[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "electrostock-api"
version = "0.1.0"
description = "API para la gestion de un taller de vehiculos electricos"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "email-validator>=2.2,<3",
  "PyJWT>=2.9,<3",
  "nh3>=0.2.18,<0.3",
  "pydantic-settings>=2.5,<3",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8.3,<9", "pytest-cov>=5,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-fail-under=80"

[tool.setuptools.packages.find]
include = ["app*"]
